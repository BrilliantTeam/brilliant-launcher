app-id: net.brilliantw.launcher
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: BrilliantLauncher
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=~/.minecraft:ro
  - --filesystem=~/.minecraftx:ro
  - --filesystem=~/.config/xmcl:ro
  - --filesystem=xdg-data/PrismLauncher:ro
  - --filesystem=xdg-data/PolyMC:ro
  - --filesystem=xdg-data/MultiMC:ro
  - --filesystem=xdg-data/ModrinthApp:ro
  - --filesystem=~/.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher:ro
  - --filesystem=~/.var/app/com.modrinth.ModrinthApp/data/ModrinthApp:ro
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: brilliant-launcher
    buildsystem: simple
    sources:
      - type: file
        path: BrilliantLauncher
      - type: file
        path: icon.png
      - type: file
        path: net.brilliantw.launcher.desktop
      - type: file
        path: net.brilliantw.launcher.metainfo.xml
    build-commands:
      - install -Dm755 BrilliantLauncher /app/bin/BrilliantLauncher
      - install -Dm644 icon.png /app/share/icons/hicolor/128x128/apps/net.brilliantw.launcher.png
      - install -Dm644 net.brilliantw.launcher.desktop /app/share/applications/net.brilliantw.launcher.desktop
      - install -Dm644 net.brilliantw.launcher.metainfo.xml /app/share/metainfo/net.brilliantw.launcher.metainfo.xml
