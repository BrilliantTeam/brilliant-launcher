[package]
name = "brilliant-launcher"
version = "1.1.2"
description = "輝煌伺服器 Minecraft 啟動器"
authors = ["RiceChen_"]
publish = false
edition = "2021"
rust-version = "1.82"

[lib]
name = "brilliant_launcher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "net", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
futures = "0.3"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
anyhow = "1"
rand = "0.8"
ring = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Foundation"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
