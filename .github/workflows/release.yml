name: 打包並發佈啟動器
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: "--bundles appimage"
          - os: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 簽出儲存庫
        uses: actions/checkout@v4

      - name: 設置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安裝 Linux 依賴
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential

      - name: 快取 Rust 編譯
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
          save-if: false

      - name: 設置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 確認版本號與標籤一致
        id: version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::標籤 ${GITHUB_REF_NAME} 與 tauri.conf.json 的版本 $version 不一致"
            exit 1
          fi

      - name: 確認發布通道標註
        id: channel
        run: node .github/release-channel.mjs "${{ steps.version.outputs.version }}" "$(git log -1 --format=%s)"

      - name: 打包安裝檔
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}

      - name: 整理安裝檔名稱
        run: |
          mkdir -p release
          v=${{ steps.version.outputs.version }}
          b=src-tauri/target
          case "${{ matrix.os }}" in
            windows-latest) cp "$(ls $b/release/bundle/nsis/*-setup.exe | head -1)" "release/BrilliantLauncher_${v}_x64-setup.exe" ;;
            macos-latest)
              cp "$(ls $b/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)" "release/BrilliantLauncher_${v}_universal.dmg"
              app="$(ls -d $b/universal-apple-darwin/release/bundle/macos/*.app | head -1)"
              tar -czf "release/BrilliantLauncher_${v}_universal.app.tar.gz" -C "$(dirname "$app")" "$(basename "$app")"
              ;;
            *) cp "$(ls $b/release/bundle/appimage/*.AppImage | head -1)" "release/BrilliantLauncher_${v}_amd64.AppImage" ;;
          esac
          ls -la release

      - name: 打包 Flatpak
        if: matrix.os == 'ubuntu-22.04'
        continue-on-error: true
        run: |
          v=${{ steps.version.outputs.version }}
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.flatpak.Builder org.gnome.Platform//49 org.gnome.Sdk//49
          cp src-tauri/target/release/BrilliantLauncher flatpak/BrilliantLauncher
          cp src-tauri/icons/icon.png flatpak/icon.png
          sed -i "s|<release version=\"[^\"]*\" date=\"[^\"]*\"|<release version=\"${v}\" date=\"$(date +%F)\"|" flatpak/net.brilliantw.launcher.metainfo.xml
          dbus-run-session -- flatpak run org.flatpak.Builder --user --disable-rofiles-fuse --force-clean --repo=flatpak-repo flatpak-build flatpak/net.brilliantw.launcher.yml
          flatpak build-bundle flatpak-repo "release/BrilliantLauncher_${v}_x86_64.flatpak" net.brilliantw.launcher --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: 數位簽章
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node .github/sign-release.mjs release "SIGNATURES-${{ runner.os }}.json"

      - name: 發佈 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 輝煌啟動器 v${{ steps.version.outputs.version }}
          generate_release_notes: false
          draft: false
          prerelease: ${{ steps.channel.outputs.prerelease }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: release/*
