name: 打包並發佈啟動器
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: "--bundles appimage,deb"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 簽出儲存庫
        uses: actions/checkout@v4

      - name: 設置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安裝 Linux 依賴
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential

      - name: 快取 Rust 編譯
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 設置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 確認版本號與標籤一致
        id: version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::標籤 ${GITHUB_REF_NAME} 與 tauri.conf.json 的版本 $version 不一致"
            exit 1
          fi

      - name: 打包安裝檔
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}

      - name: 整理安裝檔名稱
        run: |
          mkdir -p release
          v=${{ steps.version.outputs.version }}
          b=src-tauri/target
          case "${{ matrix.os }}" in
            windows-latest) cp "$(ls $b/release/bundle/nsis/*-setup.exe | head -1)" "release/BrilliantLauncher_${v}_x64-setup.exe" ;;
            *)
              cp "$(ls $b/release/bundle/appimage/*.AppImage | head -1)" "release/BrilliantLauncher_${v}_amd64.AppImage"
              cp "$(ls $b/release/bundle/deb/*.deb | head -1)" "release/BrilliantLauncher_${v}_amd64.deb"
              ;;
          esac
          ls -la release

      - name: 發佈 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 輝煌啟動器 v${{ steps.version.outputs.version }}
          generate_release_notes: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release/*
