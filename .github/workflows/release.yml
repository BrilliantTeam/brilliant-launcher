name: 打包並發佈啟動器
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      only_android:
        description: 只重新打包 Android 版（補出 Google Play 的 AAB，不動已發布的電腦版檔案）
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      desktop: ${{ steps.plan.outputs.desktop }}
      matrix: ${{ steps.plan.outputs.matrix }}
      android: ${{ steps.plan.outputs.android }}
    steps:
      - name: 簽出儲存庫
        uses: actions/checkout@v4

      - name: 確認版本號、標籤、發布通道與平台
        id: plan
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || tag="v$version${{ inputs.only_android && '-android' || '' }}"
          node .github/release-channel.mjs "$version" "$(git log -1 --format=%s)" "$tag"

  release:
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 簽出儲存庫
        uses: actions/checkout@v4

      - name: 設置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安裝 Linux 依賴
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential

      - name: 快取 Rust 編譯
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
          save-if: false

      - name: 設置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 打包安裝檔
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}

      - name: 整理安裝檔名稱
        run: |
          mkdir -p release
          v=${{ needs.plan.outputs.version }}
          b=src-tauri/target
          case "${{ matrix.os }}" in
            windows-latest) cp "$(ls $b/release/bundle/nsis/*-setup.exe | head -1)" "release/BrilliantLauncher_${v}_x64-setup.exe" ;;
            macos-latest)
              cp "$(ls $b/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)" "release/BrilliantLauncher_${v}_universal.dmg"
              app="$(ls -d $b/universal-apple-darwin/release/bundle/macos/*.app | head -1)"
              tar -czf "release/BrilliantLauncher_${v}_universal.app.tar.gz" -C "$(dirname "$app")" "$(basename "$app")"
              ;;
            *) cp "$(ls $b/release/bundle/appimage/*.AppImage | head -1)" "release/BrilliantLauncher_${v}_amd64.AppImage" ;;
          esac
          ls -la release

      - name: 打包 Flatpak
        if: matrix.os == 'ubuntu-22.04'
        continue-on-error: true
        run: |
          v=${{ needs.plan.outputs.version }}
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.flatpak.Builder org.gnome.Platform//49 org.gnome.Sdk//49
          cp src-tauri/target/release/BrilliantLauncher flatpak/BrilliantLauncher
          cp src-tauri/icons/icon.png flatpak/icon.png
          sed -i "s|<release version=\"[^\"]*\" date=\"[^\"]*\"|<release version=\"${v}\" date=\"$(date +%F)\"|" flatpak/net.brilliantw.launcher.metainfo.xml
          dbus-run-session -- flatpak run org.flatpak.Builder --user --disable-rofiles-fuse --force-clean --repo=flatpak-repo flatpak-build flatpak/net.brilliantw.launcher.yml
          flatpak build-bundle flatpak-repo "release/BrilliantLauncher_${v}_x86_64.flatpak" net.brilliantw.launcher --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: 數位簽章
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node .github/sign-release.mjs release "SIGNATURES-${{ runner.os }}.json"

      - name: 發佈 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: 輝煌啟動器 v${{ needs.plan.outputs.version }}
          generate_release_notes: false
          draft: false
          prerelease: ${{ needs.plan.outputs.prerelease }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: release/*

  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 簽出儲存庫
        uses: actions/checkout@v4

      - name: 簽出手機執行層
        uses: actions/checkout@v4
        with:
          repository: BrilliantTeam/brilliant-mobile-runtime
          path: runtime
          submodules: true

      - name: 設置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: 設置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 安裝 Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: 快取 Rust 編譯
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: android

      - name: 設置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安裝 Android NDK
        run: |
          ndk="$ANDROID_HOME/ndk/27.3.13750724"
          [ -d "$ndk" ] || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.3.13750724"
          test -x "$ndk/ndk-build"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: 建置手機執行層
        working-directory: runtime
        run: |
          chmod +x gradlew
          ./gradlew :brilliant_runtime:assembleRelease :androidnsbypass:assembleRelease -Porg.gradle.java.installations.paths="$JAVA_HOME_8_X64" --no-daemon --console=plain

      - name: 準備 Android 簽章金鑰
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE，拒絕產出沒有簽章的 AAB"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BRILLIANT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 打包 Google Play 版 AAB
        working-directory: src-tauri
        env:
          BRILLIANT_PLAY: '1'
          ORG_GRADLE_PROJECT_brilliantRuntimeDir: ${{ github.workspace }}/runtime
          BRILLIANT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BRILLIANT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BRILLIANT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cargo tauri android build --aab --target aarch64

      - name: 上傳 Google Play 版 AAB
        uses: actions/upload-artifact@v4
        with:
          name: BrilliantLauncher_${{ needs.plan.outputs.version }}_play
          path: src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          if-no-files-found: error
