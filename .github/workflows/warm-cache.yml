name: 預熱編譯快取
on:
  push:
    branches:
      - main
    paths:
      - "src-tauri/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-cache
  cancel-in-progress: true

jobs:
  warm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 簽出儲存庫
        uses: actions/checkout@v4

      - name: 設置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安裝 Linux 依賴
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential

      - name: 快取 Rust 編譯
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release

      - name: 設置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 編譯
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --no-bundle ${{ matrix.args }}
